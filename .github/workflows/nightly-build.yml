name: Nightly Build

on:
  schedule:
    - cron: '0 18 * * *' # Daily at 02:00 UTC+8 (18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  nightly-release:
    name: Build & Publish Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Nightly Tag & Date
        id: meta
        run: |
          DATE_TAG="nightly-$(date +'%Y%m%d')"
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Run Prebuild Versioning
        env:
          CI: 'true'
          BUILD_CHANNEL: 'nightly'
        run: node scripts/prebuild.js

      - name: Assemble Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Publish Nightly Pre-Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Nightly Build ${{ steps.meta.outputs.date }}"
          prerelease: true
          draft: false
          generate_release_notes: true
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
